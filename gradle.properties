# Project-wide Gradle settings.

# JVM args for Gradle daemon (Java 21 compatible).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Pin Gradle to a JDK the Android/Kotlin toolchain understands.
# The system default is JDK 25, which AGP 8.7 / Kotlin 2.1 cannot parse
# (java.lang.IllegalArgumentException: 25.0.1). Point at Android Studio's
# bundled JBR (JDK 21) instead. Override locally if your JBR lives elsewhere.
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home

# Use AndroidX.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Non-transitive R classes (smaller, faster builds).
android.nonTransitiveRClass=true

# Enable Gradle configuration caching and parallel builds.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# AndroidX MediaPlayer / lint baseline tolerance.
android.suppressUnsupportedCompileSdk=36

# Native audio build (Oboe via CMake/NDK). This is enabled by default so all
# application builds exercise the production audio path.
enableNativeBuild=true
