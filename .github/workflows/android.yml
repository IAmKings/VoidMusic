name: Android Build & Release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install native build toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate release automation scripts
        run: bash -n scripts/prepare_release.sh scripts/validate_release_shrinker.sh

      - name: Run unit tests, lint, and debug build
        run: >
          ./gradlew
          -Dorg.gradle.java.home="$JAVA_HOME"
          -PenableNativeBuild=true
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          --no-daemon
          --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: void-music-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Sign and publish release APK
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install native build toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "Missing GitHub Secret: ANDROID_RELEASE_KEYSTORE_BASE64" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/void-music-release.jks"
          chmod 600 "$RUNNER_TEMP/void-music-release.jks"

      - name: Assemble signed release APK
        env:
          VOID_MUSIC_STORE_FILE: ${{ runner.temp }}/void-music-release.jks
          VOID_MUSIC_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          VOID_MUSIC_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          VOID_MUSIC_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: >
          ./gradlew
          -Dorg.gradle.java.home="$JAVA_HOME"
          -PenableNativeBuild=true
          :app:assembleRelease
          --no-daemon
          --stacktrace

      - name: Verify Release shrinker contracts
        run: bash scripts/validate_release_shrinker.sh

      - name: Verify and prepare release files
        id: prepare
        run: |
          set -euo pipefail
          expected_tag=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            expected_tag="$GITHUB_REF_NAME"
          fi
          bash scripts/prepare_release.sh \
            app/build/outputs/apk/release/app-release.apk \
            release-dist \
            "$expected_tag"

      - name: Upload signed release files
        uses: actions/upload-artifact@v4
        with:
          # run_number is numeric and remains valid even when a branch ref contains '/'.
          name: void-music-release-${{ github.run_number }}
          path: release-dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.version_name }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "Void Music $RELEASE_VERSION" \
              --draft=false \
              --prerelease=false \
              --latest=false \
              --verify-tag
            gh release upload "$GITHUB_REF_NAME" release-dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-dist/* \
              --title "Void Music $RELEASE_VERSION" \
              --verify-tag \
              --latest=false \
              --generate-notes \
              --notes "自动构建的 Void Music 内测里程碑版本；稳定期发布门禁将在三档设备验收完成后启用。"
          fi
